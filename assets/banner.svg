<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0B0806"/>
<stop offset="45%" stop-color="#21130D"/>
<stop offset="100%" stop-color="#402317"/>
</linearGradient>

<linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#4A281A" stop-opacity="0"/>
<stop offset="25%" stop-color="#7A4B30" stop-opacity=".5"/>
<stop offset="55%" stop-color="#C49A6C" stop-opacity=".9"/>
<stop offset="80%" stop-color="#8B5E3C" stop-opacity=".6"/>
<stop offset="100%" stop-color="#4A281A" stop-opacity="0"/>
</linearGradient>

<linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
<stop offset="0%" stop-color="#3A2115" stop-opacity="0"/>
<stop offset="35%" stop-color="#8B5E3C" stop-opacity=".5"/>
<stop offset="60%" stop-color="#D4B18A" stop-opacity=".7"/>
<stop offset="100%" stop-color="#5A321F" stop-opacity="0"/>
</linearGradient>

<radialGradient id="light">
<stop offset="0%" stop-color="#C49A6C" stop-opacity=".25"/>
<stop offset="55%" stop-color="#8B5E3C" stop-opacity=".08"/>
<stop offset="100%" stop-color="#0B0806" stop-opacity="0"/>
</radialGradient>

<filter id="softGlow">
<feGaussianBlur stdDeviation="10"/>
</filter>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="320" rx="28" fill="url(#bg)"/>

<!-- AMBIENT LIGHT -->

<ellipse cx="150" cy="145" rx="300" ry="190" fill="url(#light)"/>
<ellipse cx="1050" cy="170" rx="300" ry="190" fill="url(#light)"/>

<!-- SOFT GLOW -->

<path
d="M-100 220 C100 80 240 300 430 165 S720 70 900 185 S1100 250 1300 120"
fill="none"
stroke="#C49A6C"
stroke-width="18"
opacity=".06"
filter="url(#softGlow)"
/>

<!-- FLUID WAVE 1 -->

<path
d="M-80 205
C90 95 210 280 380 175
S650 70 820 165
S1080 275 1280 130"
fill="none"
stroke="url(#wave1)"
stroke-width="3"
/>

<!-- FLUID WAVE 2 -->

<path
d="M-100 250
C80 150 230 310 410 215
S680 105 850 200
S1080 300 1300 165"
fill="none"
stroke="url(#wave2)"
stroke-width="1.5"
/>

<!-- FLUID WAVE 3 -->

<path
d="M-100 105
C90 195 220 25 400 105
S650 210 810 105
S1050 25 1300 105"
fill="none"
stroke="#8B5E3C"
stroke-width="1"
opacity=".4"
/>

<!-- DATA PARTICLES -->

<g fill="#C49A6C">

<circle cx="120" cy="145" r="2"/>
<circle cx="220" cy="105" r="1.5"/>
<circle cx="315" cy="180" r="2"/>
<circle cx="420" cy="125" r="1.5"/>
<circle cx="525" cy="165" r="2"/>
<circle cx="650" cy="110" r="1.5"/>
<circle cx="760" cy="180" r="2"/>
<circle cx="880" cy="125" r="1.5"/>
<circle cx="980" cy="190" r="2"/>
<circle cx="1090" cy="135" r="1.5"/>

</g>

<!-- CENTRAL GLASS PANEL -->

<rect
x="300"
y="65"
width="600"
height="150"
rx="28"
fill="#0B0806"
fill-opacity=".72"
stroke="#8B5E3C"
stroke-opacity=".45"
stroke-width="1"
/>

<!-- SMALL LABEL -->

<text
x="600"
y="103"
text-anchor="middle"
fill="#C49A6C"
font-family="Arial, Helvetica, sans-serif"
font-size="11"
font-weight="600"
letter-spacing="4"

>

DATA ANALYTICS </text>

<!-- NAME -->

<text
x="600"
y="145"
text-anchor="middle"
fill="#F1E3D0"
font-family="Arial, Helvetica, sans-serif"
font-size="34"
font-weight="700"
letter-spacing="5"

>

CAROLINA FAGUNDES </text>

<!-- SUBTITLE -->

<text
x="600"
y="175"
text-anchor="middle"
fill="#C49A6C"
font-family="Arial, Helvetica, sans-serif"
font-size="12"
letter-spacing="3"

>

DATA • BUSINESS • TECHNOLOGY </text>

<!-- DESCRIPTION -->

<text
x="600"
y="198"
text-anchor="middle"
fill="#B99B7A"
font-family="Arial, Helvetica, sans-serif"
font-size="10"
letter-spacing="2"

>

TURNING DATA INTO BUSINESS INSIGHTS </text>

<!-- TOP DECORATIVE LINE -->

<path
d="M420 35 H530"
stroke="#8B5E3C"
stroke-width="1"
opacity=".6"
/>

<circle
cx="600"
cy="35"
r="3"
fill="#C49A6C"
/>

<path
d="M670 35 H780"
stroke="#8B5E3C"
stroke-width="1"
opacity=".6"
/>

<!-- BOTTOM FLOW -->

<path
d="M200 270
C360 220 430 300 600 255
S850 220 1000 270"
fill="none"
stroke="#8B5E3C"
stroke-width="1"
opacity=".45"
/>

<circle cx="600" cy="255" r="3" fill="#C49A6C"/>

</svg>
